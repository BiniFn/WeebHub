name: Android APK Release

on:
  push:
    tags:
      - android-debug-*
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare APK asset
        run: cp weebhub-web/android/app/build/outputs/apk/debug/app-debug.apk weebhub-android-debug.apk

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          files: weebhub-android-debug.apk
          name: WeebHub Android Debug ${{ github.ref_name }}
          body: |
            Debug Android APK build for WeebHub.

            Download `weebhub-android-debug.apk` from this release to install the Android build.
          prerelease: true

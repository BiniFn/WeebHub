name: Android APK Release

on:
  push:
    tags:
      - android-debug-*
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: weebhub-web/package-lock.json

      - name: Install dependencies
        working-directory: weebhub-web
        run: npm ci

      - name: Build web app (mobile)
        working-directory: weebhub-web
        run: SEA_PUBLIC_PLATFORM=mobile ./node_modules/.bin/rsbuild build

      - name: Sync Capacitor
        working-directory: weebhub-web
        run: npx --yes @capacitor/cli sync android

      - name: Make gradlew executable
        working-directory: weebhub-web/android
        run: chmod +x ./gradlew

      - name: Build Debug APK
        working-directory: weebhub-web/android
        run: ./gradlew assembleDebug

      - name: Copy APK to root
        run: cp weebhub-web/android/app/build/outputs/apk/debug/app-debug.apk weebhub-android-debug.apk

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          files: weebhub-android-debug.apk
          name: WeebHub Android ${{ github.ref_name }}
          body: |
            ## WeebHub Android APK

            A fully built debug APK for WeebHub on Android.

            ### Installation
            1. Download `weebhub-android-debug.apk`
            2. Enable "Install from unknown sources" in your Android settings
            3. Open the APK to install

            > This is a debug build. You will need to enter your WeebHub server address after installing.
          prerelease: true

name: Build Electron App

on:
  workflow_call:
    #    secrets:
    #      SUBMODULE_PAT:
    #        required: true
    outputs:
      appVersion:
        description: "The version of the app"
        value: ${{ jobs.build-electron.outputs.app_version }}

jobs:
  build-electron:
    strategy:
      fail-fast: false
      matrix:
        # IDs:
        # - weebhub-desktop-darwin-arm
        # - weebhub-desktop-darwin-intel
        # - weebhub-desktop-linux
        # - weebhub-desktop-windows
        include:
          # For Mac
          - os: 'macos-latest'
            id: 'weebhub-desktop-darwin-arm64'
            go_binary_id: 'weebhub-server-darwin' # Artifact: go-weebhub-server-darwin (contains both arm64 and x86_64)
            electron_args: '--mac --arm64'
            upload_patterns: |
              ./weebhub-denshi/dist/*arm64*
              ./weebhub-denshi/dist/latest-mac.yml
          # For Intel Macs
          - os: 'macos-15-intel'
            id: 'weebhub-desktop-darwin-x64'
            go_binary_id: 'weebhub-server-darwin' # Artifact: go-weebhub-server-darwin (contains both arm64 and x86_64)
            electron_args: '--mac --x64'
            upload_patterns: |
              ./weebhub-denshi/dist/*x64*
          # For Linux
          - os: 'ubuntu-latest'
            id: 'weebhub-desktop-linux-x64'
            go_binary_id: 'weebhub-server-linux' # Artifact: go-weebhub-server-linux (contains x86_64)
            electron_args: '--linux --x64'
            upload_patterns: |
              ./weebhub-denshi/dist/*Linux*
              ./weebhub-denshi/dist/*linux*
              ./weebhub-denshi/dist/latest-linux.yml
          # For Windows
          - os: 'windows-latest'
            id: 'weebhub-desktop-windows-x64'
            go_binary_id: 'weebhub-server-windows' # Artifact: go-weebhub-server-windows (contains x86_64)
            electron_args: '--win --x64'
            upload_patterns: |
              ./weebhub-denshi/dist/*Windows*
              ./weebhub-denshi/dist/*.exe
              ./weebhub-denshi/dist/latest.yml

    runs-on: ${{ matrix.os }}
    outputs:
      app_version: ${{ steps.get-version.outputs.version }}

    steps:
      - name: Checkout code and submodules 📂
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      #          submodules: recursive
      #          lfs: true
      #          token: ${{ secrets.SUBMODULE_PAT }}

      - name: Setup Node.js 📦
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Get package version 📦
        id: get-version
        run: |
          NODE_VERSION=$(node -p "require('./weebhub-denshi/package.json').version")
          echo "version=$NODE_VERSION" >> $GITHUB_OUTPUT
        shell: bash

      # Install dependencies
      - name: Install dependencies (Ubuntu) 📦
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libnss3-dev libxss-dev libasound2-dev

      # Download the web folders
      # TODO Uncomment if building web
      - name: Download web folder artifact 📥
        uses: actions/download-artifact@v4
        with:
          name: web-denshi
          path: web-denshi

      # Move web-denshi folder into weebhub-denshi
      - name: Move web-denshi folder 🚚
        run: |
          rm -rf weebhub-denshi/web-denshi
          mv web-denshi weebhub-denshi/
        shell: bash

      - name: Ensure binaries folder exists (UNIX)
        if: startsWith(matrix.os, 'macos') || matrix.os == 'ubuntu-latest'
        run: mkdir -p ./weebhub-denshi/binaries

      - name: Ensure binaries folder exists (Windows)
        if: matrix.os == 'windows-latest'
        run: mkdir .\weebhub-denshi\binaries

      # Download the server binaries based on matrix.go_binary_id
      - name: Download server binaries 📥
        uses: actions/download-artifact@v4
        with:
          name: go-${{ matrix.go_binary_id }}
          path: ./weebhub-denshi/binaries

      # Extract server binaries
      - name: Extract server binaries (macOS x64) 📂
        if: matrix.os == 'macos-15-intel' && matrix.id == 'weebhub-desktop-darwin-x64'
        run: |
          tar -xf ./weebhub-denshi/binaries/binaries-${{ matrix.go_binary_id }}.tar -C ./weebhub-denshi/binaries
          rm -rf ./weebhub-denshi/binaries/weebhub-server-darwin-arm64
          rm -rf ./weebhub-denshi/binaries/binaries-${{ matrix.go_binary_id }}.tar

      - name: Extract server binaries (macOS arm64) 📂
        if: matrix.os == 'macos-latest' && matrix.id == 'weebhub-desktop-darwin-arm64'
        # Extracts weebhub-server-darwin-arm64 and weebhub-server-darwin-amd64
        # Only keep weebhub-server-darwin-arm64
        run: |
          tar -xf ./weebhub-denshi/binaries/binaries-${{ matrix.go_binary_id }}.tar -C ./weebhub-denshi/binaries
          # Remove the other binary
          rm -rf ./weebhub-denshi/binaries/weebhub-server-darwin-amd64
          rm -rf ./weebhub-denshi/binaries/binaries-${{ matrix.go_binary_id }}.tar

      - name: Extract server binaries (Linux) 📂
        if: matrix.os == 'ubuntu-latest' && matrix.id == 'weebhub-desktop-linux-x64'
        # Extracts weebhub-server-linux-amd64
        run: |
          tar -xf ./weebhub-denshi/binaries/binaries-${{ matrix.go_binary_id }}.tar -C ./weebhub-denshi/binaries
          rm -rf ./weebhub-denshi/binaries/binaries-${{ matrix.go_binary_id }}.tar

      - name: Extract server binaries (Windows) 📂
        if: matrix.os == 'windows-latest'
        # Extracts weebhub-server-windows-amd64
        run: |
          7z x ".\weebhub-denshi\binaries\binaries-${{ matrix.go_binary_id }}.zip" "-o./weebhub-denshi/binaries/"
          del ".\weebhub-denshi\binaries\binaries-${{ matrix.go_binary_id }}.zip"

      #      # Copy app icon
      #      - name: Copy app icon 📝
      #        run: |
      #          mkdir -p ./weebhub-denshi/assets
      #          cp ./weebhub-desktop/src-tauri/app-icon.png ./weebhub-denshi/assets/
      #        shell: bash

      - name: Ensure server binaries executable (UNIX)
        if: startsWith(matrix.os, 'macos') || matrix.os == 'ubuntu-latest'
        run: chmod -R +x ./weebhub-denshi/binaries/

      # Install and build
      - name: Install and build 📦️
        run: |
          cd weebhub-denshi
          npm ci
          npm run build -- ${{ matrix.electron_args }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Upload the artifacts
      - name: Upload Electron artifacts 📤
        uses: actions/upload-artifact@v4
        with:
          name: electron-${{ matrix.id }}
          path: ${{ matrix.upload_patterns }}
